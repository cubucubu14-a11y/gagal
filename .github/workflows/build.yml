name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        # Buat temporary flutter project untuk mengambil folder android & pubspec bawaan
        flutter create temp_app --org com.example.kasirwoii --platforms=android
        cp -r temp_app/android ./
        cp temp_app/pubspec.yaml ./pubspec.yaml.bak
        rm -rf temp_app

    - name: Restore Custom pubspec.yaml & lib
      run: |
        # Pastikan pubspec.yaml dan lib kita tetap aman dan digunakan
        echo "Using custom lib and pubspec"

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
